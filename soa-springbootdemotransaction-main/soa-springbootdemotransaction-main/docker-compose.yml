
name: samyojitha-microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: samyojitha-postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: skill_exam_2400032211
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400032211"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  transaction-service:
    image: samyojitha/transaction-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samyojitha-transaction-service
    ports:
      - "2004:2004"
    environment:
      SERVER_PORT: 2004
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill_exam_2400032211
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
